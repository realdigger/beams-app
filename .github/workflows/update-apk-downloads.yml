name: Update APK download counter

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );

            const downloads = releases
              .flatMap((release) => release.assets)
              .filter((asset) => asset.name.toLowerCase().endsWith('.apk'))
              .reduce((total, asset) => total + asset.download_count, 0);

            const data = JSON.stringify(
              {
                schemaVersion: 1,
                label: 'APK downloads',
                message: String(downloads),
                color: 'brightgreen',
              },
              null,
              2,
            ) + '\n';

            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'downloads.json',
              });
              const previous = Buffer.from(
                existing.data.content,
                'base64',
              ).toString('utf8');

              if (previous === data) return;
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'downloads.json',
              message: 'Update APK download counter',
              content: Buffer.from(data).toString('base64'),
              sha,
            });
